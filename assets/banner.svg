<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="purplePink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#ff0080" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0.2"/>
    </linearGradient>

    <radialGradient id="orbGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="orbGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff0080" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ff0080" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.6"/>
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .glow-pulse {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .radar-sweep {
        transform-origin: 1040px 210px;
        animation: rotateSweep 8s linear infinite;
      }
      .wave-line {
        stroke-dasharray: 8 6;
        animation: dashMove 20s linear infinite;
      }
      .ping-circle {
        transform-origin: 1040px 210px;
        animation: pingRing 3s cubic-bezier(0, 0.2, 0.8, 1) infinite;
      }
      @keyframes rotateSweep {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -1000; }
      }
      @keyframes pulse {
        0% { opacity: 0.3; transform: scale(0.96); }
        100% { opacity: 0.7; transform: scale(1.04); }
      }
      @keyframes pingRing {
        0% { r: 10; opacity: 0.9; }
        80% { r: 95; opacity: 0; }
        100% { r: 95; opacity: 0; }
      }
    </style>
  </defs>

  <!-- Deep Slate Tech Canvas -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Background Cyber Grid -->
  <rect width="1200" height="420" fill="url(#cyberGrid)" />

  <!-- Ambient Glowing Orbs in Background -->
  <circle cx="150" cy="90" r="220" fill="url(#orbGlow1)" />
  <circle cx="1060" cy="220" r="260" fill="url(#orbGlow2)" />
  <circle cx="650" cy="380" r="180" fill="url(#orbGlow1)" />

  <!-- Animated Dynamic Background Network & Signal Stream -->
  <g opacity="0.35">
    <path class="wave-line" d="M 0 320 Q 300 260 600 310 T 1200 280" fill="none" stroke="#00f2fe" stroke-width="2" />
    <path class="wave-line" d="M 0 110 Q 320 180 620 130 T 1200 150" fill="none" stroke="#7928ca" stroke-width="1.8" />
  </g>

  <!-- Dynamic Radar Scanner (Right-Hand Background Visual) -->
  <g>
    <!-- Target Radar Rings -->
    <circle cx="1040" cy="210" r="110" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="1040" cy="210" r="75" fill="none" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="1040" cy="210" r="40" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
    
    <!-- Expanding Ping Wave -->
    <circle class="ping-circle" cx="1040" cy="210" r="20" fill="none" stroke="#00f2fe" stroke-width="2" />

    <!-- Animated Sweep Sector -->
    <g class="radar-sweep">
      <path d="M 1040 210 L 1150 210 A 110 110 0 0 0 1118 132 Z" fill="url(#cyberCyan)" opacity="0.22" />
      <line x1="1040" y1="210" x2="1150" y2="210" stroke="#00f2fe" stroke-width="2" filter="url(#subtleGlow)"/>
    </g>

    <!-- Detected Threat Nodes -->
    <circle cx="1090" cy="170" r="4.5" fill="#ef4444" filter="url(#subtleGlow)"/>
    <circle cx="985" cy="240" r="3.5" fill="#22c55e" filter="url(#subtleGlow)"/>
    <circle cx="1020" cy="145" r="4" fill="#eab308" filter="url(#subtleGlow)"/>
  </g>

  <!-- FOREGROUND CONTENT: Safe Left-to-Center Alignment (Guaranteed 100% visible & readable) -->

  <!-- Top Category Chip -->
  <g transform="translate(80, 52)">
    <rect width="275" height="32" rx="16" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7"/>
    <circle cx="18" cy="16" r="4.5" fill="#00f2fe" filter="url(#subtleGlow)"/>
    <text x="32" y="21" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" letter-spacing="1">CURATED THREAT INTELLIGENCE</text>
  </g>

  <!-- Main Title -->
  <text x="80" y="145" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
    Automated Threat &amp; Anomaly
  </text>
  <text x="80" y="202" fill="url(#cyberCyan)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" filter="url(#subtleGlow)">
    Detection Ecosystem 🛡️⚡
  </text>

  <!-- Subtitle -->
  <text x="82" y="246" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400">
    Enterprise SaaS Platforms &bull; Open-Source EDR/XDR &bull; UEBA Behavioral Analytics &bull; Network IDS
  </text>

  <!-- Dynamic Feature Badges / Pills in Foreground -->
  <g transform="translate(80, 286)">
    <!-- Pill 1: EDR & XDR -->
    <rect x="0" y="0" width="138" height="38" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
    <text x="16" y="24" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">⚡ EDR / XDR</text>

    <!-- Pill 2: Behavioral AI -->
    <rect x="150" y="0" width="158" height="38" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
    <text x="166" y="24" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🧠 Behavioral AI</text>

    <!-- Pill 3: Anomaly Analytics -->
    <rect x="320" y="0" width="168" height="38" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
    <text x="336" y="24" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">📊 UEBA &amp; SIEM</text>

    <!-- Pill 4: Zero Trust -->
    <rect x="500" y="0" width="156" height="38" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
    <text x="516" y="24" fill="#f43f5e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🎯 Incident SOAR</text>
  </g>

  <!-- Bottom Accent Status Bar -->
  <g transform="translate(80, 360)">
    <line x1="0" y1="0" x2="680" y2="0" stroke="#334155" stroke-width="1"/>
    <text x="0" y="22" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="500">
      ⚡ MITRE ATT&amp;CK Mappings &nbsp;|&nbsp; 🔍 Live Telemetry Inspection &nbsp;|&nbsp; 🚀 100% Production-Grade Tools
    </text>
  </g>
</svg>
